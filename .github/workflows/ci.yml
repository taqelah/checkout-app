name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the acceptance tests
        run: npm test
        continue-on-error: true
      - name: Send results to Threadline
        if: always()
        env:
          THREADLINE_URL: ${{ secrets.THREADLINE_URL }}
          THREADLINE_SECRET: ${{ secrets.THREADLINE_SECRET }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          RUN_ID: "#${{ github.run_number }} on ${{ github.ref_name }} (${{ github.sha }})"
        run: |
          node -e '
            const fs = require("fs");
            const body = {run_id: process.env.RUN_ID, channel: process.env.SLACK_CHANNEL, junit_xml: fs.readFileSync("results/junit.xml", "utf8")};
            fs.writeFileSync("payload.json", JSON.stringify(body));
          '
          curl -sS --fail -X POST "$THREADLINE_URL/ci" \
            -H "Content-Type: application/json" \
            -H "X-Threadline-Secret: $THREADLINE_SECRET" \
            --data @payload.json
