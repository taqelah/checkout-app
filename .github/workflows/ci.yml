name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Spec Keeper's own GitHub activity, so results follow an approval in Slack with nobody starting a run:
  # requirement issues opened (Approve all) and "Changed to v2 …" comments (a change approved).
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  test:
    # Only Spec Keeper's account (the token it files issues with) starts runs from issues and comments, and
    # only for requirement issues and change comments; its CI-result comments don't.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == 'syamsasi99' &&
        contains(github.event.issue.labels.*.name, 'requirement')) ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'syamsasi99' &&
        startsWith(github.event.comment.body, 'Changed to v'))
    # Approve all opens several issues at once: one run for the burst, the latest. On the job, not the
    # workflow, so a skipped run (another comment) can't cancel one in progress.
    concurrency:
      group: acceptance-tests
      cancel-in-progress: true
    # The test report, with a video of each test, goes to GitHub Pages; Slack links to it.
    permissions:
      contents: read
      pull-requests: read  # to find the PR a merge came from, for the link in Slack
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit hashes: a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Run the acceptance tests
        run: npm test
        continue-on-error: true
      # Publishing the report is a bonus: if it fails, the results still go to Spec Keeper, without the link.
      - name: Package the test report with videos
        id: report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report
      - name: Publish it to GitHub Pages
        id: pages
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Send results to Spec Keeper
        if: ${{ !cancelled() }}  # failed tests are still results; a run replaced by a newer one isn't
        env:
          SPECKEEPER_URL: ${{ secrets.SPECKEEPER_URL }}
          SPECKEEPER_SECRET: ${{ secrets.SPECKEEPER_SECRET }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          REPORT_URL: ${{ steps.pages.outputs.page_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export RUN_ID="#$GITHUB_RUN_NUMBER on $GITHUB_REF_NAME (${GITHUB_SHA::7})"  # short commit id, as GitHub shows it
          # On a push (a merge), the PR it came from. A run started by an approval tests the same code but
          # wasn't caused by that PR, so it gets no PR link.
          export PR_URL=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            PR_URL="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].html_url // ""' 2>/dev/null || true)"
          fi
          node -e '
            const fs = require("fs");
            const body = {run_id: process.env.RUN_ID, channel: process.env.SLACK_CHANNEL, junit_xml: fs.readFileSync("results/junit.xml", "utf8"), report_url: process.env.REPORT_URL || "", run_url: process.env.RUN_URL || "", pr_url: process.env.PR_URL || ""};
            fs.writeFileSync("payload.json", JSON.stringify(body));
          '
          curl -sS --fail -X POST "$SPECKEEPER_URL/ci" \
            -H "Content-Type: application/json" \
            -H "X-SpecKeeper-Secret: $SPECKEEPER_SECRET" \
            --data @payload.json
