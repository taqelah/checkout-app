name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit hashes: a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Run the acceptance tests
        run: npm test
        continue-on-error: true
      - name: Send results to Spec Keeper
        if: always()
        env:
          SPECKEEPER_URL: ${{ secrets.SPECKEEPER_URL }}
          SPECKEEPER_SECRET: ${{ secrets.SPECKEEPER_SECRET }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          RUN_ID: "#${{ github.run_number }} on ${{ github.ref_name }} (${{ github.sha }})"
        run: |
          node -e '
            const fs = require("fs");
            const body = {run_id: process.env.RUN_ID, channel: process.env.SLACK_CHANNEL, junit_xml: fs.readFileSync("results/junit.xml", "utf8")};
            fs.writeFileSync("payload.json", JSON.stringify(body));
          '
          curl -sS --fail -X POST "$SPECKEEPER_URL/ci" \
            -H "Content-Type: application/json" \
            -H "X-SpecKeeper-Secret: $SPECKEEPER_SECRET" \
            --data @payload.json
